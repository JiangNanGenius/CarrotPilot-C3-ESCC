name: Personal Smoke

on:
  push:
    branches:
      - "personal/c3-escc"
      - "personal/c3-escc-atune"
  pull_request:
    branches:
      - "personal/c3-escc"
      - "personal/c3-escc-atune"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  personal-smoke:
    name: Personal static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Fetch personal comparison refs
        run: |
          git fetch --tags --force origin || true
          git fetch --no-tags origin personal/c3-escc:refs/heads/personal/c3-escc || true
          git fetch --no-tags https://github.com/ajouatom/openpilot.git c3-wip:refs/remotes/origin/c3-wip happymaj11r/carrot-wip-model_selector:refs/remotes/origin/happymaj11r/carrot-wip-model_selector happymaj11r/carrot-wip-model_selector:refs/heads/tracking/model-selector || true
          git fetch --no-tags https://github.com/jixiexiaoge/openpilot.git master:refs/remotes/jixie/master master:refs/heads/tracking/jixie-master || true
          git fetch --no-tags https://github.com/jixiexiaoge/navipilot.git CPdazi:refs/remotes/jixie-navipilot/CPdazi CPdazi:refs/heads/tracking/jixie-navipilot || true
          git fetch --no-tags https://jihulab.com/fishop/openpilot.git cp:refs/remotes/fishop/cp cp:refs/heads/tracking/fishop-cp || true

      - name: Run personal smoke check
        run: python3 scripts/personal/smoke_check.py

      - name: Run ESCC and AlwaysOffroad preflight
        run: python3 scripts/personal/escc_offroad_preflight.py --no-manual

      - name: Run CPlink preflight
        run: python3 scripts/personal/cplink_preflight.py --no-manual
